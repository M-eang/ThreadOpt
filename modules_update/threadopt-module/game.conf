# 游戏档配置（帧率优先）：前台检测到本文件中的游戏包名时自动生效
# 游戏线程全部绑定到性能核，功耗不考虑（打游戏时通常接散热）
# 修改后无需重启：省电档下保存立即刷新检测名单，游戏档下保存立即生效

# 规则说明：
#   e-core    能效小核    p-core    性能中核    hp-core   高性能大核
#   包名 { 线程名 = CPU范围 }   线程名支持通配符 * ? [范围]

# 王者荣耀：渲染线程与 Unity 线程全上大核
com.tencent.tmgp.sgame {
    UnityMain=hp-core
    UnityGfxDeviceW=hp-core
    UnityGfxDeviceC=hp-core
    UnityPlayer=p-core,hp-core
}

# 和平精英
com.tencent.tmgp.pubgmhd {
    Thread-[0-9]?=hp-core
    Thread-?=hp-core
    RenderThread*=hp-core
    RHIThread=p-core,hp-core
}

# 原神：Unity 渲染线程上大核
com.miHoYo.Yuanshen {
    UnityMain=hp-core
    UnityGfx*=hp-core
    UnityPlayer=p-core,hp-core
}

# 崩坏：星穹铁道
com.miHoYo.hkrpg {
    UnityMain=hp-core
    UnityGfx*=hp-core
}

# 绝区零
com.miHoYo.nap {
    UnityMain=hp-core
    UnityGfx*=hp-core
}

# 蛋仔派对
com.netease.party {
    MainThread=hp-core
    Compute*=p-core,hp-core
    RenderThread*=hp-core
}

# 第五人格
com.netease.dwrg {
    Thread-*=p-core,hp-core
    NativeThread=hp-core
}

# 金铲铲之战
com.tencent.jkchess {
    UnityMain=hp-core
    UnityGfx*=hp-core
}

# 三角洲行动
com.tencent.tmgp.dfm {
    GameThread=hp-core
    Thread*=p-core,hp-core
    TaskGraphNP*=p-core,hp-core
    AudioTrack=e-core,p-core
}

# 光遇
com.netease.sky {
    UnityMain=hp-core
    UnityGfx*=hp-core
}

# 明日方舟
com.hypergryph.arknights {
    UnityMain=hp-core
    UnityGfx*=hp-core
}

# 使命召唤手游
com.tencent.tmgp.codm {
    UnityMain=hp-core
    UnityGfx*=hp-core
}
